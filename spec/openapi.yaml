components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: spm_session
      description: >-
        Cookie сесії, яку видає `POST /sessions`; атрибут `SameSite=Lax`. Та сама сесія, що й у
        вебінтерфейсі (REQ-NF-031).

  parameters:
    page:
      name: page
      in: query
      required: false
      description: >-
        Номер сторінки від 1; без параметра — перша. Номер за межами — 200 з порожнім `items`.
        Сторінка — 50 записів (REQ-F-057).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    supplier_id:
      name: supplier_id
      in: path
      required: true
      description: Ідентифікатор постачальника.
      schema:
        type: integer
      example: 1
    material_id:
      name: material_id
      in: path
      required: true
      description: Ідентифікатор матеріалу.
      schema:
        type: integer
      example: 1
    supplier_item_id:
      name: supplier_item_id
      in: path
      required: true
      description: Ідентифікатор позиції постачальника.
      schema:
        type: integer
      example: 21
    run_id:
      name: run_id
      in: path
      required: true
      description: Ідентифікатор запуску.
      schema:
        type: integer
      example: 42

  responses:
    Unauthorized:
      description: Запит без сесії або після 8 годин бездіяльності (REQ-NF-031, REQ-NF-021).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              $ref: '#/components/examples/unauthenticated'
    Forbidden:
      description: >-
        Менеджер звертається до операції адміністратора; стан системи не змінюється (REQ-F-003,
        REQ-F-005, REQ-NF-031).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              $ref: '#/components/examples/forbidden'
    NotFound:
      description: Ресурсу з ідентифікатором зі шляху немає, у позиції немає прив'язки або адреса невідома.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_found:
              $ref: '#/components/examples/not_found'
    MethodNotAllowed:
      description: >-
        Метод не підтримується адресою, зокрема DELETE на адресах постачальників і матеріалів
        (REQ-F-010, REQ-NF-031). Стосується методів, яких у контракті немає.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            method_not_allowed:
              $ref: '#/components/examples/method_not_allowed'
    UnsupportedMediaType:
      description: 'Запит з тілом без `Content-Type: application/json`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupported_media_type:

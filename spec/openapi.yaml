openapi: 3.1.0
info:
  title: Моніторинг цін постачальників — REST API
  version: 0.1.0
  description: |
    Контракт REST API системи моніторингу цін постачальників матеріалів (REQ-NF-031).
    Джерела: `spec/srs.md` 1.9, `docs/api/resources.md`. Після API-GATE контракт змінюється
    лише адендумом (SRS, п. 3.1.4).

    **Сесія.** Вхід — `POST /sessions`; сервер видає cookie `spm_session` з атрибутом
    `SameSite=Lax` (схема `cookieAuth`). Сесія та сама, що й у вебінтерфейсі, і завершується
    після 8 годин бездіяльності (REQ-NF-021). Ключів і токенів немає.

    **Порядок перевірок.** Відповідь дає перша перевірка, що не пройшла:
    401 (сесія) → 403 (роль) → 404 (ресурс зі шляху) → 415 (`Content-Type` запиту з тілом) →
    422 (вміст запиту) → 409 (стан системи). Менеджер на операції адміністратора завжди
    отримує 403 «немає доступу» (REQ-F-005).

    **Запити.** Запити з тілом (`POST`, `PUT`, `PATCH`) — лише з
    `Content-Type: application/json`, інакше 415. Запити без тіла (`POST /runs`, `DELETE`)
    заголовка не потребують. Невідоме поле або поле лише для читання в тілі — 422. Невідомі
    параметри запиту ігноруються.

    **Відповідь 405.** Метод, якого адреса не має, отримує 405 `method_not_allowed`
    (спільна відповідь `MethodNotAllowed`). Зокрема DELETE на адресах постачальників і
    матеріалів: записи не видаляються, лише деактивуються через `PATCH` з `active: false`
    (REQ-F-010). DELETE є лише для виходу і зняття прив'язки (Р-118).

    **Значення.** Дата — `РРРР-ММ-ДД`; дата й час — ISO 8601 зі зсувом київського часу.
    Ціни й різниця в гривнях — рядок із крапкою і двома знаками (`"1250.50"`). Відсотки —
    число, округлене до 0,1, без «+». Відсутнє значення — `null`, поле є завжди; виняток —
    постачальник для менеджера без `catalog_url` і `parser` (REQ-F-070).

    **Сторінки.** Списки REQ-F-057 віддаються по 50 записів; номер сторінки `page` від 1;
    номер за межами — 200 з порожнім `items`. Порядок фіксований.

    **Помилки.** `application/problem+json` (RFC 9457): `type` — завжди `about:blank`,
    `title` — українська назва статусу HTTP, `detail` — текст українською, `code` — машинний
    код, `errors` — помилки полів.

    **Приклади.** Кожна відповідь має іменовані приклади для mock-сервера; для помилок —
    окремий приклад на кожен `code`.
servers:
  - url: http://localhost:8000/api/v1
    description: локальний сервер
security:
  - cookieAuth: []
tags:
  - name: Вхід і розмежування доступу
    description: Вхід, поточна сесія, вихід (SRS, п. 2.2; REQ-F-001…REQ-F-006, REQ-F-070, REQ-F-071).
  - name: Ведення довідників
    description: >-
      Функція 1 (SRS, п. 2.2): постачальники, матеріали, деактивація; прив'язка позицій
      постачальників до матеріалів.
  - name: Автоматичне оновлення цін
    description: >-
      Функція 2 (SRS, п. 2.2): ручний запуск, журнал оновлень, прийняття нового обсягу,
      налаштування, стан оновлення постачальників.
  - name: Порівняння цін
    description: 'Функція 3 (SRS, п. 2.2): загальний список порівняння і порівняння матеріалу.'
  - name: Історія цін
    description: 'Функція 4 (SRS, п. 2.2): екран історії матеріалу за період.'
  - name: Сповіщення про зміни цін і асортименту
    description: 'Функція 5 (SRS, п. 2.2): стрічка змін.'

paths:
  /sessions:
    post:
      tags: [Вхід і розмежування доступу]
      operationId: createSession
      summary: Вхід — відкрити сесію
      description: >-
        Відкриває сесію за логіном і паролем. Логін звіряється без урахування регістру
        (REQ-F-001). Роль — без сесії.
      x-req-ids: [REQ-F-001, REQ-NF-021, REQ-NF-031]
      x-bdd: [BDD-065, BDD-068]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            examples:
              admin:
                summary: вхід адміністратора з логіном в іншому регістрі
                value: { login: Admin, password: correct-password }
      responses:
        '201':
          description: Сесію відкрито.
          headers:
            Set-Cookie:
              description: Cookie сесії `spm_session` з атрибутом `SameSite=Lax`.
              schema:
                type: string
              example: spm_session=<значення>; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                admin:
                  summary: логін — як збережено в обліковому записі
                  value: { account: { login: admin, role: admin } }
        '401':
          description: Неправильний логін або пароль.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid_credentials:
                  $ref: '#/components/examples/invalid_credentials'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Тіло запиту некоректне.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validation_failed:
                  $ref: '#/components/examples/validation_failed_login_required'
                validation_failed_malformed_json:
                  $ref: '#/components/examples/validation_failed_malformed_json'

  /sessions/current:
    get:
      tags: [Вхід і розмежування доступу]
      operationId: getCurrentSession
      summary: Поточна сесія — логін і роль
      description: >-
        Логін у тому вигляді, у якому його збережено в обліковому записі, і роль (REQ-F-071).
        Роль — обидві.
      x-req-ids: [REQ-F-071, REQ-NF-031]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Поточна сесія.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                admin:
                  summary: адміністратор
                  value: { account: { login: admin, role: admin } }
                manager:
                  summary: менеджер
                  value: { account: { login: ivan.petrenko_1, role: manager } }
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Вхід і розмежування доступу]
      operationId: deleteCurrentSession
      summary: Вихід — завершити сесію
      description: >-
        Завершує сесію (REQ-F-002). Це не видалення запису (REQ-NF-031, Р-118). Тіла немає,
        `Content-Type` не потрібен. Роль — обидві.
      x-req-ids: [REQ-F-002, REQ-NF-031]
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Сесію завершено.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /suppliers:
    get:
      tags: [Ведення довідників]
      operationId: listSuppliers
      summary: Список постачальників
      description: >-
        Екран «постачальники» для адміністратора; для менеджера — список для фільтра стрічки
        (REQ-F-070). Усі постачальники, зокрема неактивні, за назвою в абетковому порядку
        (REQ-F-057). Менеджер отримує постачальника без `catalog_url` і `parser`. Роль — обидві.
      x-req-ids: [REQ-F-007, REQ-F-011, REQ-F-034, REQ-F-057, REQ-F-068, REQ-F-070]
      x-bdd: [BDD-070]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Сторінка постачальників.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPage'
              examples:
                admin:
                  summary: адміністратор — усі поля
                  value:
                    items:
                      - { id: 1, name: Альфа, catalog_url: 'http://localhost:8001/a', parser: table_layout, active: true, last_update_date: '2026-10-05' }
                      - { id: 2, name: Бета, catalog_url: 'http://localhost:8001/b', parser: cards_layout, active: true, last_update_date: '2026-10-04' }
                      - { id: 3, name: Гама, catalog_url: 'http://localhost:8001/c', parser: list_layout, active: true, last_update_date: null }
                      - { id: 4, name: Ірпінь, catalog_url: 'http://localhost:8001/d', parser: table_layout, active: false, last_update_date: '2026-09-20' }
                    page: 1
                    page_size: 50
                    total_items: 4
                    total_pages: 1
                manager:
                  summary: менеджер — без адреси каталогу і розбирача (BDD-070)
                  value:
                    items:
                      - { id: 1, name: Альфа, active: true, last_update_date: '2026-10-05' }
                      - { id: 2, name: Бета, active: true, last_update_date: '2026-10-04' }
                      - { id: 3, name: Гама, active: true, last_update_date: null }
                      - { id: 4, name: Ірпінь, active: false, last_update_date: '2026-09-20' }
                    page: 1
                    page_size: 50
                    total_items: 4
                    total_pages: 1
                page_out_of_range:
                  summary: номер сторінки за межами
                  value: { items: [], page: 3, page_size: 50, total_items: 4, total_pages: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Ведення довідників]
      operationId: createSupplier
      summary: Створити постачальника
      description: >-
        Назва обов'язкова й унікальна без урахування регістру; адреса каталогу — абсолютна
        адреса http або https; розбирач — один зі списку `GET /parsers` (REQ-F-007). Роль — адмін.
      x-req-ids: [REQ-F-007, REQ-NF-006]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreate'
            examples:
              alpha:
                summary: новий постачальник
                value: { name: Альфа, catalog_url: 'http://localhost:8001/a', parser: table_layout, active: true }
      responses:
        '201':
          description: Постачальника створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
              examples:
                alpha:
                  summary: щойно створений постачальник
                  value: { id: 1, name: Альфа, catalog_url: 'http://localhost:8001/a', parser: table_layout, active: true, last_update_date: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Тіло запиту некоректне.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validation_failed:
                  $ref: '#/components/examples/validation_failed_name_required'
                validation_failed_catalog_url_invalid:
                  $ref: '#/components/examples/validation_failed_catalog_url_invalid'
                validation_failed_parser_unknown:
                  $ref: '#/components/examples/validation_failed_parser_unknown'
                validation_failed_unknown_field:
                  $ref: '#/components/examples/validation_failed_unknown_field'
                validation_failed_read_only_field:
                  $ref: '#/components/examples/validation_failed_read_only_field'
                validation_failed_invalid_type:
                  $ref: '#/components/examples/validation_failed_invalid_type'
                validation_failed_malformed_json:
                  $ref: '#/components/examples/validation_failed_malformed_json'
        '409':
          description: Назва постачальника вже є.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                supplier_name_taken:
                  $ref: '#/components/examples/supplier_name_taken'

  /suppliers/{supplier_id}:
    parameters:
      - $ref: '#/components/parameters/supplier_id'
    get:
      tags: [Ведення довідників]
      operationId: getSupplier
      summary: Один постачальник
      description: Форма редагування постачальника. Роль — адмін.
      x-req-ids: [REQ-F-007]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Постачальник.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
              examples:
                alpha:
                  summary: постачальник
                  value: { id: 1, name: Альфа, catalog_url: 'http://localhost:8001/a', parser: table_layout, active: true, last_update_date: '2026-10-05' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Ведення довідників]
      operationId: updateSupplier
      summary: Змінити, деактивувати чи активувати постачальника
      description: >-
        Змінює будь-які з полів `name`, `catalog_url`, `parser`, `active`. `active: false` —
        деактивація (REQ-F-010, REQ-F-011), `active: true` — повторна активація (REQ-F-056).
        Зміна діє з наступного запуску (REQ-F-067). Роль — адмін.
      x-req-ids: [REQ-F-007, REQ-F-010, REQ-F-011, REQ-F-056, REQ-F-067]
      x-bdd: [BDD-044, BDD-053, BDD-060]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdate'
            examples:
              deactivate:
                summary: деактивація
                value: { active: false }
              change_catalog_url:
                summary: зміна адреси каталогу
                value: { catalog_url: 'http://localhost:8001/a2' }
      responses:
        '200':
          description: Постачальника змінено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
              examples:
                deactivated:
                  summary: постачальник після деактивації
                  value: { id: 4, name: Ірпінь, catalog_url: 'http://localhost:8001/d', parser: table_layout, active: false, last_update_date: '2026-09-20' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Тіло запиту некоректне.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validation_failed:
                  $ref: '#/components/examples/validation_failed_catalog_url_invalid'
                validation_failed_parser_unknown:
                  $ref: '#/components/examples/validation_failed_parser_unknown'
                validation_failed_read_only_field:
                  $ref: '#/components/examples/validation_failed_read_only_field'
                validation_failed_unknown_field:
                  $ref: '#/components/examples/validation_failed_unknown_field'
                validation_failed_malformed_json:
                  $ref: '#/components/examples/validation_failed_malformed_json'
        '409':
          description: Назва постачальника вже є.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                supplier_name_taken:
                  $ref: '#/components/examples/supplier_name_taken'

  /parsers:
    get:
      tags: [Ведення довідників]
      operationId: listParsers
      summary: Список наявних розбирачів
      description: >-
        Назви розбирачів, з яких адміністратор обирає розбирач постачальника (REQ-F-007,
        REQ-NF-006). Переліку розбирачів контракт не фіксує. Роль — адмін.
      x-req-ids: [REQ-F-007, REQ-NF-006]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список розбирачів.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParserList'
              examples:
                three_layouts:
                  summary: розбирачі для трьох версток (REQ-NF-026)
                  value: { items: [table_layout, cards_layout, list_layout] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /materials:
    get:
      tags: [Ведення довідників]
      operationId: listMaterials
      summary: Список матеріалів
      description: >-
        Екран «матеріали» і вибір матеріалу під час прив'язки й перев'язки (REQ-F-069) для
        адміністратора; для менеджера — вибір матеріалу на екрані історії і фільтр стрічки
        (REQ-F-070). Усі матеріали, зокрема неактивні, за найменуванням в абетковому порядку
        (REQ-F-057). Роль — обидві.
      x-req-ids: [REQ-F-008, REQ-F-049, REQ-F-057, REQ-F-068, REQ-F-069, REQ-F-070]
      x-bdd: [BDD-063, BDD-070]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - name: q
          in: query
          required: false
          description: Пошук за найменуванням без урахування регістру.
          schema:
            type: string
          example: лдсп
      responses:
        '200':
          description: Сторінка матеріалів.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPage'
              examples:
                with_inactive:
                  summary: активний і деактивований матеріали (BDD-070)
                  value:
                    items:
                      - { id: 1, name: ЛДСП Білий 18 мм, unit: шт, active: true, linked_items_count: 2 }
                      - { id: 2, name: М2, unit: шт, active: false, linked_items_count: 1 }
                    page: 1
                    page_size: 50
                    total_items: 2
                    total_pages: 1
                page_out_of_range:
                  summary: номер сторінки за межами
                  value: { items: [], page: 2, page_size: 50, total_items: 2, total_pages: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Ведення довідників]
      operationId: createMaterial
      summary: Створити матеріал
      description: >-
        Найменування обов'язкове й унікальне без урахування регістру; одиниця виміру непорожня
        (REQ-F-008). Роль — адмін.
      x-req-ids: [REQ-F-008]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
            examples:
              ldsp:
                summary: новий матеріал
                value: { name: ЛДСП Білий 18 мм, unit: шт, active: true }
      responses:
        '201':
          description: Матеріал створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
              examples:
                ldsp:
                  summary: щойно створений матеріал
                  value: { id: 1, name: ЛДСП Білий 18 мм, unit: шт, active: true, linked_items_count: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Тіло запиту некоректне.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validation_failed:
                  $ref: '#/components/examples/validation_failed_name_required'
                validation_failed_unit_required:
                  $ref: '#/components/examples/validation_failed_unit_required'
                validation_failed_unknown_field:
                  $ref: '#/components/examples/validation_failed_unknown_field'
                validation_failed_invalid_type:
                  $ref: '#/components/examples/validation_failed_invalid_type'
                validation_failed_malformed_json:
                  $ref: '#/components/examples/validation_failed_malformed_json'
        '409':
          description: Найменування матеріалу вже є.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                material_name_taken:
                  $ref: '#/components/examples/material_name_taken'

  /materials/{material_id}:
    parameters:
      - $ref: '#/components/parameters/material_id'
    get:
      tags: [Ведення довідників]
      operationId: getMaterial
      summary: Один матеріал
      description: Форма редагування матеріалу. Роль — адмін.
      x-req-ids: [REQ-F-008]
      security:
        - cookieAuth: []

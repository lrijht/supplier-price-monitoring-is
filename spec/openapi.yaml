  schemas:
    Price:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Сума в гривнях — рядок із крапкою і двома знаками.
      examples: ['1250.50']
    Percent:
      type: number
      description: Відсотки, округлені до 0,1 (половина від нуля), без «+».
      examples: [1.2]
    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: Номер сторінки.
        page_size:
          type: integer
          const: 50
          description: Розмір сторінки (REQ-F-057).
        total_items:
          type: integer
          minimum: 0
          description: Кількість записів у списку.
        total_pages:
          type: integer
          minimum: 0
          description: Кількість сторінок.

    Role:
      type: string
      enum: [manager, admin]
      description: Роль облікового запису (Д.10).
    Account:
      type: object
      required: [login, role]
      properties:
        login:
          type: string
          description: Логін у тому вигляді, у якому його збережено (REQ-F-071).
        role:
          $ref: '#/components/schemas/Role'
    Session:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/Account'
    SessionCreate:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          description: Логін; звіряється без урахування регістру (REQ-F-001).
        password:
          type: string
          minLength: 1
          description: Пароль.

    SupplierRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Назва постачальника.
    SupplierRefWithActive:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean
          description: '`false` — позначка «постачальник неактивний» (REQ-F-011).'
    Supplier:
      type: object
      additionalProperties: false
      required: [id, name, catalog_url, parser, active, last_update_date]
      description: Постачальник для адміністратора (Д.1).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Назва; унікальна без урахування регістру.
        catalog_url:
          type: string
          description: Адреса каталогу — абсолютна адреса http або https.
        parser:
          type: string
          description: Розбирач — одне зі значень `GET /parsers`.
        active:
          type: boolean
        last_update_date:
          type: [string, 'null']
          format: date
          readOnly: true
          description: Дата останнього оновлення (REQ-F-034); `null` — «ще не оновлювався».
    SupplierForManager:
      type: object
      additionalProperties: false
      required: [id, name, active, last_update_date]
      description: Постачальник для менеджера — без адреси каталогу і розбирача (REQ-F-070).
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean
        last_update_date:
          type: [string, 'null']
          format: date
    SupplierCreate:
      type: object
      additionalProperties: false
      required: [name, catalog_url, parser, active]
      properties:
        name:
          type: string
          minLength: 1
        catalog_url:
          type: string
          pattern: '^https?://'
        parser:
          type: string
        active:
          type: boolean
    SupplierUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        catalog_url:
          type: string
          pattern: '^https?://'
        parser:
          type: string
        active:
          type: boolean
    SupplierPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/Supplier'
                  - $ref: '#/components/schemas/SupplierForManager'
    ParserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Назви наявних розбирачів.
          items:
            type: string

    MaterialRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Найменування матеріалу.
    MaterialRefWithActive:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean
          description: '`false` — «матеріал деактивовано» (REQ-F-049).'
    MaterialRefWithUnit:
      type: object
      required: [id, name, unit]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
          description: Одиниця матеріалу (REQ-F-068).
    Material:
      type: object
      required: [id, name, unit, active, linked_items_count]
      description: Матеріал (Д.2).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Найменування; унікальне без урахування регістру.
        unit:
          type: string
          description: Одиниця виміру.
        active:
          type: boolean
        linked_items_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Кількість прив'язаних позицій.
    MaterialCreate:
      type: object
      additionalProperties: false
      required: [name, unit, active]
      properties:
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        active:
          type: boolean
    MaterialUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        active:
          type: boolean
    MaterialPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Material'

    SupplierItem:
      type: object
      required: [id, supplier, sku, name, unit]
      description: Позиція постачальника (Д.3) у прив'язці.
      properties:
        id:
          type: integer
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        sku:
          type: string
          description: Артикул.
        name:
          type: string
          description: Найменування з останньої сторінки.
        unit:
          type: string
          description: Одиниця з останньої сторінки.
    UnlinkedSupplierItem:
      type: object
      required: [id, supplier, sku, name, unit, last_seen_date]
      properties:
        id:
          type: integer
        supplier:
          $ref: '#/components/schemas/SupplierRefWithActive'
        sku:
          type: string
        name:
          type: string
        unit:
          type: string
        last_seen_date:
          type: string
          format: date
          description: Дата, коли позицію бачили востаннє (REQ-F-012).
    AttentionSupplierItem:
      type: object
      required: [id, supplier, sku, name, unit]
      properties:
        id:
          type: integer
        supplier:
          $ref: '#/components/schemas/SupplierRefWithActive'
        sku:
          type: string
        name:
          type: string
        unit:
          type: string
          description: Одиниця на сторінці (REQ-F-068).
    Link:
      type: object
      required: [supplier_item, material]
      description: Прив'язка (Д.4).
      properties:
        supplier_item:
          $ref: '#/components/schemas/SupplierItem'
        material:
          $ref: '#/components/schemas/MaterialRef'
    LinkPut:
      type: object
      additionalProperties: false
      required: [material_id]
      properties:
        material_id:
          type: integer
          description: Матеріал, до якого прив'язати позицію.
    LinkPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Link'
    UnlinkedItem:
      type: object
      required: [supplier_item]
      properties:
        supplier_item:
          $ref: '#/components/schemas/UnlinkedSupplierItem'
    UnlinkedItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UnlinkedItem'
    AttentionItem:
      type: object
      required: [supplier_item, material, last_unit_mismatch_date]
      properties:
        supplier_item:
          $ref: '#/components/schemas/AttentionSupplierItem'
        material:
          $ref: '#/components/schemas/MaterialRefWithUnit'
        last_unit_mismatch_date:
          type: string
          format: date
          description: Дата останньої ціни дня з позначкою «одиниця не збігається» (REQ-F-068).
    AttentionItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AttentionItem'

    DailyPrice:
      type: object
      required: [price, date, unit_mismatch]
      description: Ціна дня (Д.5).
      properties:
        price:
          $ref: '#/components/schemas/Price'
        date:
          type: string
          format: date
        unit_mismatch:
          type: boolean
          description: Позначка «одиниця не збігається».
    ComparisonListRow:
      type: object
      required: [material, cheapest_supplier, price]
      properties:
        material:
          $ref: '#/components/schemas/MaterialRef'
        cheapest_supplier:
          description: Найдешевший постачальник; `null` — придатної ціни немає.
          oneOf:
            - $ref: '#/components/schemas/SupplierRef'
            - type: 'null'
        price:
          description: Його ціна; `null` — придатної ціни немає.
          oneOf:
            - $ref: '#/components/schemas/Price'
            - type: 'null'
    ComparisonListPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ComparisonListRow'
    DifferenceFromCheapest:
      type: object
      required: [percent, amount]
      properties:
        percent:
          $ref: '#/components/schemas/Percent'
        amount:
          $ref: '#/components/schemas/Price'
    MaterialComparisonRow:
      type: object
      required: [supplier, daily_price, stale, cheapest, difference_from_cheapest]
      properties:
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        daily_price:
          description: Остання відома ціна; `null` — «ціни ще немає».
          oneOf:
            - $ref: '#/components/schemas/DailyPrice'
            - type: 'null'
        stale:
          type: [boolean, 'null']
          description: Позначка «застаріла» (REQ-F-038); `null`, коли ціни немає.
        cheapest:
          type: boolean
          description: Рядок із мінімальною придатною ціною.
        difference_from_cheapest:
          description: Різниця з найдешевшою; `null` — «—» (REQ-F-036).
          oneOf:
            - $ref: '#/components/schemas/DifferenceFromCheapest'
            - type: 'null'
    MaterialComparison:
      type: object
      required: [material, items]
      properties:
        material:
          $ref: '#/components/schemas/MaterialRefWithActive'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialComparisonRow'

    HistoryPeriod:
      type: string
      enum: [last_7_days, last_30_days, all]
      description: Період історії (REQ-F-040).
    PriceHistoryRow:
      type: object
      required: [date, supplier, price, unit_mismatch, effective_at_period_start]
      properties:
        date:
          type: string
          format: date
          description: Дата встановлення ціни.
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        price:
          $ref: '#/components/schemas/Price'
        unit_mismatch:
          type: boolean
        effective_at_period_start:
          type: boolean
          description: Позначка «чинна на початок періоду».
    PriceHistory:
      type: object
      required: [material, period, items]
      properties:
        material:
          $ref: '#/components/schemas/MaterialRefWithActive'
        period:
          $ref: '#/components/schemas/HistoryPeriod'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceHistoryRow'

    EventKind:
      type: string
      enum: [price_change, appeared, disappeared]
      description: Вид події (Д.6).
    Event:
      type: object
      required: [id, kind, date, created_at, material, supplier, old_price, new_price, change_percent, price]
      description: Подія стрічки змін (Д.6).
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/EventKind'
        date:
          type: string
          format: date
          description: Дата ціни дня — дата запуску, що створив подію.
        created_at:
          type: string
          format: date-time
        material:
          $ref: '#/components/schemas/MaterialRef'
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        old_price:
          description: Стара ціна (база стрічки); лише для `price_change`.
          oneOf:
            - $ref: '#/components/schemas/Price'
            - type: 'null'
        new_price:
          description: Нова ціна; лише для `price_change`.
          oneOf:
            - $ref: '#/components/schemas/Price'
            - type: 'null'
        change_percent:
          type: [number, 'null']
          description: Зміна у відсотках, від'ємна — з мінусом; лише для `price_change`.
        price:
          description: Ціна; лише для `appeared`.
          oneOf:
            - $ref: '#/components/schemas/Price'
            - type: 'null'
    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Event'

    SupplierUpdateStatus:
      type: object
      required: [supplier, last_update_date]
      properties:
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        last_update_date:
          type: [string, 'null']
          format: date
          description: '`null` — «ще не оновлювався».'
    SupplierUpdateStatusPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupplierUpdateStatus'

    Settings:
      type: object
      required: [update_time, notification_threshold]
      description: Налаштування (Д.9).
      properties:
        update_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Час щоденного оновлення за київським часом, ГГ:ХХ.
        notification_threshold:
          type: number
          minimum: 0.1
          maximum: 50
          multipleOf: 0.1
          description: Поріг сповіщень, %.
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        update_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        notification_threshold:
          type: number
          minimum: 0.1
          maximum: 50
          multipleOf: 0.1

    RunTrigger:
      type: string
      enum: [scheduled, manual, catch_up]
      description: Спосіб запуску (Д.7).
    RunStatus:
      type: string
      enum: [success, partial, error, interrupted, in_progress]
      description: Загальний статус запуску (REQ-F-032).
    SupplierRunStatusValue:
      type: [string, 'null']
      enum: [success, partial, error, not_finished, null]
      description: Статус постачальника в запуску; `null` — у запуску, що триває, дані ще не записано.
    ReasonCode:
      type: [string, 'null']
      enum: [unavailable, timeout, unparsable, write_failed, null]
      description: Причина помилки постачальника; лише для `error`.
    RunWarning:
      type: object
      required: [kind, sku]
      properties:
        kind:
          type: string
          enum: [unit_mismatch, duplicate_sku, unparsed_row, non_positive_price]
          description: Вид попередження (Д.8).
        sku:
          type: [string, 'null']
          description: Артикул; `null` для рядка без артикула.
    SupplierRunStatus:
      type: object
      required: [supplier, status, parsed_items_count, reason_code, error_reason, warnings, volume_acceptance_available]
      description: Статус постачальника в запуску (Д.8).
      properties:
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        status:
          $ref: '#/components/schemas/SupplierRunStatusValue'
        parsed_items_count:
          type: [integer, 'null']
          description: '`null` для `error`, `not_finished` і без статусу.'
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
        error_reason:
          type: [string, 'null']
          description: Текст причини, як у журналі.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RunWarning'
        volume_acceptance_available:
          type: boolean
          description: Є кнопка «прийняти новий обсяг» (REQ-F-031).
    Run:
      type: object
      required: [id, trigger, started_at, finished_at, started_by, status, supplier_run_statuses]
      description: Запуск (Д.7).
      properties:
        id:
          type: integer
        trigger:
          $ref: '#/components/schemas/RunTrigger'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
          description: '`null` для `in_progress` і `interrupted`.'
        started_by:
          type: [string, 'null']
          description: Логін адміністратора; лише для `manual`.
        status:
          $ref: '#/components/schemas/RunStatus'
        supplier_run_statuses:
          type: array
          description: Рядки постачальників за назвою.
          items:
            $ref: '#/components/schemas/SupplierRunStatus'

    VolumeAcceptance:
      type: object
      required: [id, run_id, supplier, accepted_by, accepted_at, volume_baseline]
      description: Прийняття нового обсягу (Д.7а).
      properties:
        id:
          type: integer
        run_id:
          type: integer
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        accepted_by:
          type: string
          description: Логін адміністратора.
        accepted_at:
          type: string
          format: date-time
        volume_baseline:
          type: integer
          minimum: 1
          description: Прийнята кількість позицій — нова база обсягу.
    VolumeAcceptanceCreate:
      type: object
      additionalProperties: false
      required: [run_id, supplier_id]
      properties:
        run_id:
          type: integer
        supplier_id:
          type: integer

    RunLogEntry:
      type: object
      required: [kind, occurred_at, trigger, run, volume_acceptance]
      description: Запис журналу оновлень (Д.7, Д.7а).
      properties:
        kind:
          type: string
          enum: [run, skipped, no_active_suppliers, volume_acceptance]
        occurred_at:
          type: string
          format: date-time
          description: Час запису; для `run` — час початку, для `volume_acceptance` — час прийняття.
        trigger:
          type: [string, 'null']
          enum: [scheduled, manual, null]
          description: Привід запису «немає активних постачальників»; для інших видів — `null`.
        run:
          description: Запуск; лише для `run`.
          oneOf:
            - $ref: '#/components/schemas/Run'
            - type: 'null'
        volume_acceptance:
          description: Прийняття; лише для `volume_acceptance`.
          oneOf:
            - $ref: '#/components/schemas/VolumeAcceptance'
            - type: 'null'
    RunLogEntryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RunLogEntry'

    ProblemCode:
      type: string
      enum:
        - unauthenticated
        - invalid_credentials
        - forbidden
        - not_found
        - method_not_allowed
        - unsupported_media_type
        - validation_failed
        - supplier_name_taken
        - material_name_taken
        - unit_locked
        - link_units_differ
        - material_supplier_already_linked
        - material_inactive
        - run_in_progress
        - volume_acceptance_unavailable
      description: Машинний код помилки (docs/api/resources.md, розділ 4).
    FieldError:
      type: object
      required: [field, code, detail]
      properties:
        field:
          type: [string, 'null']
          description: Поле чи параметр; `null` — усе тіло.
        code:
          type: string
          enum:
            - required
            - invalid_type
            - unknown_field
            - read_only_field
            - malformed_json
            - catalog_url_invalid
            - parser_unknown
            - update_time_invalid
            - notification_threshold_out_of_range
            - reference_not_found
            - period_invalid
            - kind_invalid
            - page_invalid
            - supplier_name_taken
            - material_name_taken
            - unit_locked
        detail:
          type: string
          description: Пояснення українською.
    Problem:
      type: object
      required: [type, title, status, detail, code]
      description: Модель помилок API — application/problem+json (RFC 9457).
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          enum: [Неавторизовано, Заборонено, Не знайдено, Метод не дозволено, Конфлікт, Непідтримуваний тип даних, Необроблюваний вміст]
          description: Українська назва статусу HTTP.
        status:
          type: integer
          description: Код HTTP.
        detail:
          type: string
          description: Пояснення українською.
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          description: Помилки полів; для конфліктів, пов'язаних з полем.
          items:
            $ref: '#/components/schemas/FieldError'
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            code:
              const: validation_failed
            status:
              const: 422

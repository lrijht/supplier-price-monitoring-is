[project]
name = "supplier-price-monitoring-is"
version = "0.1.0"
description = "Educational information system: supplier material price monitoring (Python 3.12, FastAPI, SQLite)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "httpx==0.28.1",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is enforced by ruff format

[tool.setuptools.package-data]
spm = ["web/templates/*.html"]

{% extends "base.html" %}
{% from "macros.html" import errors_block %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
{{ errors_block(errors) }}
<form method="post" action="{{ action }}">
  <p><label>Назва <input type="text" name="name" value="{{ values.name or '' }}"></label></p>
  <p><label>Адреса каталогу <input type="text" name="catalog_url" value="{{ values.catalog_url or '' }}"></label></p>
  <p><label>Розбирач
    <select name="parser">
      {% for parser in parsers %}
      <option value="{{ parser }}"{% if parser == values.parser %} selected{% endif %}>{{ parser }}</option>
      {% endfor %}
    </select></label></p>
  <p><label><input type="checkbox" name="active" value="on"{% if values.active %} checked{% endif %}> Активний</label></p>
  <p><button type="submit">Зберегти</button> <a href="/suppliers">До списку постачальників</a></p>
</form>
{% endblock %}
